name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Test
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Performance Regression Gate
        env:
          PYTHONPATH: .
        run: |
          python evaluate.py \
            --fast \
            --no-progress \
            --seed 42 \
            --output-json /tmp/perf_gate.json
          python scripts/check_perf_gate.py /tmp/perf_gate.json \
            --min-win-rate 0.45 \
            --max-cvar10 1800.0
