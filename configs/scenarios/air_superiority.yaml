# ============================================================
# 시나리오: 공중우세 쟁취 (Air Superiority Battle)
# 규모: 비행단~비행전대급 공중전
# 출처: 학술 연구용 합성 데이터
# ============================================================

scenario:
  name: "공중우세 쟁취"
  name_en: "Air Superiority Battle"
  preset_fn: "scenario_air_superiority"   # scenario_presets.py 함수명
  description: |
    공중우세 쟁취 및 항공차단 시나리오.
    BLUE(F-35A·F-15K 비행단 + 방공망) vs
    RED(적 전투기 + 탄도미사일 + SAM체계).
    공중우세, 전략표적 타격, DEAD/SEAD 임무 포함.

# ── 병력 규모 ──────────────────────────────────────────
force:
  blue:
    total_headcount: 1200
    units:
      - type: fighter
        echelon: wing
        count: 1
        headcount: 400
        designation: "F-35A 제17전투비행단"
        morale: 0.88
        experience: 0.80
      - type: strike_aircraft
        echelon: element
        count: 2
        headcount: 120
        designation: "F-15K 편대 (타격임무)"
      - type: isr_aircraft
        echelon: flight
        count: 1
        headcount: 60
        designation: "백두·금강 ISR 편대"
      - type: early_warning
        echelon: flight
        count: 1
        headcount: 40
        designation: "E-737 조기경보기"
      - type: air_refueling
        echelon: flight
        count: 1
        headcount: 30
        designation: "KC-330 급유기"
      - type: sam_battery
        echelon: battalion
        count: 3
        headcount: 300
        designation: "패트리어트/천궁-II 포대"
  red:
    total_headcount: 900
    units:
      - type: fighter
        echelon: wing
        count: 1
        headcount: 350
        designation: "적 전투기 비행단"
        morale: 0.75
        experience: 0.65
      - type: ballistic_missile
        echelon: brigade
        count: 1
        headcount: 200
        designation: "탄도미사일여단"
      - type: sam_battery
        echelon: regiment
        count: 2
        headcount: 250
        designation: "적 SA-17/SA-21 포대"
      - type: electronic_warfare
        echelon: battalion
        count: 1
        headcount: 100
        designation: "전자전대대"

# ── 지형 ─────────────────────────────────────────────
terrain:
  map_size_km: 200             # 공중전은 넓은 작전 구역
  types:
    - { terrain: airspace, ratio: 0.80 }
    - { terrain: open, ratio: 0.12 }
    - { terrain: mountain, ratio: 0.05 }
    - { terrain: urban, ratio: 0.03 }

# ── 환경 조건 ────────────────────────────────────────
environment:
  fog_level: light
  weather: clear
  visibility_km: 50            # 공중 시계
  ceiling_ft: 30000            # 운고 (피트)
  time_of_day: daytime

# ── 특수 위협 ────────────────────────────────────────
threats:
  ballistic_missile: true
  ew_jamming: true             # 전자전 재밍
  stealth_penetration: false
  sead_mission: true           # SEAD (적 방공 제압)

# ── 학습 파라미터 ────────────────────────────────────
training:
  episodes: 600
  max_steps: 50
  reward_weights:
    air_superiority: 0.40
    asset_preservation: 0.30
    strike_effectiveness: 0.20
    isr_exploitation: 0.10
