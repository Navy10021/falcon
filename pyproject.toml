[tool.black]
line-length = 100
target-version = ["py310"]
include = "^$"
extend-exclude = ""

[tool.isort]
profile = "black"
line_length = 100
py_version = 310
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"
markers = [
  "slow: marks tests as slow (skip with -m 'not slow')",
  "fast: marks tests as quick unit/smoke tests",
]
